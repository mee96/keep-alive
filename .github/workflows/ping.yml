name: Wake portfolio backend
# cron-job.org (Europe/Madrid) pings /health every 10 min, 08:00-19:00, to keep Bunsen warm,
# but it can't wake a sleeping Render service (Render answers 503 without starting it).
# This workflow wakes it up once an hour during working hours, with retries.
# GitHub cron runs in UTC: 06-16 UTC = 08-18 CEST (summer) / 07-17 CET (winter).
on:
  schedule:
    - cron: '0 6-16 * * *'
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Bunsen backend
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 \
            https://bunsen-backend.onrender.com/health || true
