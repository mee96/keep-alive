name: Keep portfolio backend alive (manual)
# El ping programado (cada 10 min, 08:30-19:00 Europe/Madrid) se hace desde cron-job.org.
# El cron de GitHub Actions va en UTC y no sigue el cambio de hora, asi que aqui solo
# queda el disparo manual para pings puntuales.
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sf https://bunsen-backend.onrender.com/health || true
